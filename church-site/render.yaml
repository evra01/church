databases:
  - name: paroisse-db
    plan: free
    databaseName: paroisse
    user: paroisse

services:
  - type: web
    name: eglise-sainte-famille-bingerville
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: paroisse-db
          property: connectionString
